name: Deploy to VPS Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/ajocore || cd /root/ajocore || mkdir -p /var/www/ajocore && cd /var/www/ajocore
            git pull origin master || (git clone https://github.com/Sucrepapii/ajocore.git . && git checkout master)
            npm install --production=false
            npm run build
            pm2 restart ajocore || pm2 start npm --name "ajocore" -- run start
