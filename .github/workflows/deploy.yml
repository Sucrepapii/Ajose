name: Deploy to ajose.ng

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: |
          npm run build
          npm start &
          npx wait-on http://127.0.0.1:3000
          npm run cypress:run
      - name: Audit Dependencies
        run: npm audit --audit-level=high --omit=dev

