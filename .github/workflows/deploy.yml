name: Deploy to ajose.ng

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: |
          npm run build
          npm start &
          npx wait-on http://127.0.0.1:3000
          npm run cypress:run
      - name: Audit Dependencies
        run: npm audit --audit-level=high --omit=dev

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy over WireGuard
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          WG_KEY: ${{ secrets.WG_DEPLOY_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s
' "$WG_KEY" > "$RUNNER_TEMP/wg.key"
          sudo ip link add wgci type wireguard
          sudo ip addr add 10.31.0.3/32 dev wgci
          sudo wg set wgci private-key "$RUNNER_TEMP/wg.key"             peer tZvArwA5Ohoih1dOKq4gobttFdQS4kjzzndEEh/TWiM=             endpoint "$SERVER_HOST":51830 allowed-ips 10.30.0.7/32 persistent-keepalive 10
          sudo ip link set wgci up
          sudo ip route add 10.30.0.7/32 dev wgci
          rm -f "$RUNNER_TEMP/wg.key"
          printf '%s
' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '10.30.0.7 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGx0AWKB4JR63YZvoUVYQ/yxrxsatzKM3WAx62gFtTPU
' > ~/.ssh/known_hosts_167
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=30             -o UserKnownHostsFile=$HOME/.ssh/known_hosts_167 -o StrictHostKeyChecking=yes             deploy-ajose@10.30.0.7 deploy
          rm -f ~/.ssh/deploy_key
          sudo ip link del wgci || true
