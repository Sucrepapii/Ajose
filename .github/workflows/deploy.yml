name: Deploy to ajose.ng

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/ajose || (mkdir -p /opt/ajose && cd /opt/ajose)
            git pull origin master || (git clone https://github.com/Sucrepapii/ajocore.git . && git checkout master)
            npm install --production=false
            npm run build
            pm2 restart ajose || pm2 start npm --name "ajose" -- run start
