name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cap sync Android
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.AJOSE_KEYSTORE_B64 }}" | base64 --decode > android/app/ajose-release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.AJOSE_STORE_PASSWORD }}
          keyPassword=${{ secrets.AJOSE_KEY_PASSWORD }}
          keyAlias=ajose
          storeFile=ajose-release.jks
          EOF

      - name: Build release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ajose-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
