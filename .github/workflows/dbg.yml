name: dbg wg
on:
  push:
    branches: [ 'dbg/**' ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set -x
          cat /etc/os-release | head -3; sudo apt-get update -qq; sudo apt-get install -y -qq wireguard-tools >/dev/null 2>&1; wg --version
          sudo ip link add wgt type wireguard
          K=$(wg genkey)
          printf '%s\n' "$K" | sudo wg set wgt private-key /dev/stdin; echo "stdin rc=$?"
          printf '%s\n' "$K" | sudo tee /run/t.key >/dev/null; sudo chmod 600 /run/t.key
          sudo wg set wgt private-key /run/t.key; echo "rootfile rc=$?"
          printf '%s\n' "$K" > "$RUNNER_TEMP/t.key"
          sudo wg set wgt private-key "$RUNNER_TEMP/t.key"; echo "runnerfile rc=$?"
          (umask 077; printf '%s\n' "$K" > "$RUNNER_TEMP/t2.key"); sudo wg set wgt private-key "$RUNNER_TEMP/t2.key"; echo "runnerfile-umask rc=$?"
          sudo wg set wgt peer tZvArwA5Ohoih1dOKq4gobttFdQS4kjzzndEEh/TWiM= allowed-ips 10.30.0.7/32; echo "peer rc=$?"
          sudo ls -ld /dev/stdin /proc/self/fd/0; id; sudo id; sudo -l | head -5
          sudo wg show wgt | head -3
