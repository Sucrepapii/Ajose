name: dbg wg
on:
  push:
    branches: [ 'dbg/**' ]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: probe
        run: |
          set +e -x
          head -2 /etc/os-release; sudo apt-get update -qq; sudo apt-get install -y -qq wireguard-tools >/dev/null 2>&1; wg --version
          sudo ip link add wgt type wireguard
          K=$(wg genkey)
          printf '%s\n' "$K" | sudo wg set wgt private-key /dev/stdin; echo "stdin rc=$?"
          printf '%s\n' "$K" | sudo tee /run/t.key >/dev/null; sudo chmod 600 /run/t.key
          sudo wg set wgt private-key /run/t.key; echo "rootfile rc=$?"
          printf '%s\n' "$K" > "$RUNNER_TEMP/t.key"
          sudo wg set wgt private-key "$RUNNER_TEMP/t.key"; echo "runnerfile rc=$?"
          sudo wg set wgt private-key <(printf '%s\n' "$K"); echo "procsubst rc=$?"
          wg --help 2>&1 | head -3; which sudo; sudo --version | head -1
          sudo ip route add 10.30.0.7/32 dev wgt; echo "route rc=$?"
