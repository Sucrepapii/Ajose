name: Automated Direct Debit Sweep & Reminders

on:
  schedule:
    # 05:00 UTC = 06:00 AM West Africa Time (WAT) -> Primary Morning Auto-Sweep
    - cron: '0 5 * * *'
    # 08:00 UTC = 09:00 AM WAT -> 24-Hour Pre-Debit Reminders
    - cron: '0 8 * * *'
    # 17:00 UTC = 06:00 PM WAT -> Evening Auto-Sweep Retry
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  run-automated-sweep:
    runs-on: ubuntu-latest
    env:
      REPO_CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger Automated Contribution Sweep (Daily, Weekly, Monthly)
        run: |
          echo "Initiating automated sweep across all active Daily, Weekly, and Monthly circles..."
          SECRET="${REPO_CRON_SECRET:-ajose_sec_cron_99f2b810d7a6e4c}"
          
          HTTP_STATUS=$(curl -s -S -o /tmp/sweep_response.json -w "%{http_code}" -X POST "https://ajose.ng/api/cron/sweep" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Content-Type: application/json" || echo "000")
          
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          cat /tmp/sweep_response.json 2>/dev/null || echo "No response body"
          echo ""

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Automated sweep executed successfully."
          else
            echo "::warning ::Sweep endpoint returned HTTP $HTTP_STATUS"
          fi

      - name: Trigger 24h Pre-Debit Reminders
        run: |
          echo "Triggering 24-hour pre-debit member funding reminders..."
          SECRET="${REPO_CRON_SECRET:-ajose_sec_cron_99f2b810d7a6e4c}"
          
          HTTP_STATUS=$(curl -s -S -o /tmp/reminders_response.json -w "%{http_code}" -X POST "https://ajose.ng/api/cron/reminders" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Content-Type: application/json" || echo "000")
          
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/reminders_response.json 2>/dev/null || echo "No response body"
          echo ""
