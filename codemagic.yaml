workflows:

  # ── iOS ──────────────────────────────────────────────────────────────────
  ajose-ios:
    name: Ajose iOS
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Ajose ASC Key
    environment:
      vars:
        APP_STORE_APPLE_ID: 6815151482
        BUNDLE_ID: ng.ajose.app
      node: 22.9.0
    scripts:
      - name: Install deps
        script: npm ci
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set marketing version
        script: |
          cd ios/App
          xcrun agvtool new-marketing-version 1.0
      - name: Set up code signing
        script: |
          set -euo pipefail
          mkdir -p /tmp/signing

          # Decode P12 (cert + private key)
          printf '%s' "$CM_P12_BASE64" | base64 -d > /tmp/signing/signing.p12

          # Install pre-generated provisioning profile (no ASC API call needed)
          PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES_DIR"
          printf '%s' "$CM_AJOSE_PROFILE_B64" | base64 -d > "$PROFILES_DIR/ajose-appstore.mobileprovision"
          echo "=== Provisioning profile installed ==="

          keychain initialize
          keychain add-certificates \
            --certificate /tmp/signing/signing.p12 \
            --certificate-password codemagic
          xcode-project use-profiles
      - name: Build & sign IPA
        script: |
          set -eo pipefail
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive | xcpretty
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -exportPath $CM_BUILD_DIR/ipa \
            -exportOptionsPlist /Users/builder/export_options.plist | xcpretty
      - name: Upload to TestFlight
        script: |
          set -euo pipefail
          IPA=$(ls $CM_BUILD_DIR/ipa/*.ipa | head -1)
          echo "Uploading: $IPA"
          mkdir -p /tmp/api_keys
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/api_keys/AuthKey_TH9U3Q6N34.p8
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-keys /tmp/api_keys \
            --show-progress
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # ── Android ───────────────────────────────────────────────────────────────
  ajose-android:
    name: Ajose Android
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android-signing
      node: 22.9.0
      java: 21
    scripts:
      - name: Install deps
        script: npm ci
      - name: Sync Capacitor
        script: |
          mkdir -p android/app/src/main/assets
          npx cap sync android
      - name: Decode keystore
        script: |
          echo "$CM_KEYSTORE_B64" | base64 --decode > /tmp/ajose-release.jks
      - name: Write key.properties
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/ajose-release.jks
          EOF
      - name: Build release AAB
        script: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
