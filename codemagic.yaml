workflows:

  # ── iOS ──────────────────────────────────────────────────────────────────
  ajose-ios:
    name: Ajose iOS
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Ajose ASC Key
    environment:
      groups:
        - ajose-signing
      vars:
        APP_STORE_APPLE_ID: 6815151482
        BUNDLE_ID: ng.ajose.app
      node: 22.9.0
    scripts:
      - name: Install deps
        script: npm ci
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set marketing version
        script: |
          cd ios/App
          xcrun agvtool new-marketing-version 1.0
      - name: Set build number
        script: |
          NEW_BUILD=$((BUILD_NUMBER + 1000))
          cd ios/App
          xcrun agvtool new-version -all $NEW_BUILD
          echo "Build number set to $NEW_BUILD"
      - name: Set up code signing
        script: |
          set -euo pipefail
          keychain initialize
          mkdir -p /tmp/signing

          # Import the stored P12 so the distribution cert private key is in keychain
          printf '%s' "$CM_P12_BASE64" | base64 -d > /tmp/signing/signing.p12
          keychain add-certificates \
            --certificate /tmp/signing/signing.p12 \
            --certificate-password codemagic

          # Fetch/create provisioning profile (cert key is in keychain — no new cert created)
          printf '%s' "$CM_ASC_KEY_B64" | base64 -d > /tmp/asc_key.p8
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --key-id TH9U3Q6N34 \
            --issuer-id b7d9e967-a2df-47e8-82a2-29287c37db11 \
            --private-key @file:/tmp/asc_key.p8

          xcode-project use-profiles
      - name: Build & sign IPA
        script: |
          set -eo pipefail
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --config Release \
            --archive-directory $CM_BUILD_DIR/xcarchive \
            --ipa-directory $CM_BUILD_DIR/ipa
      - name: Upload to TestFlight
        script: |
          IPA=$(find "$CM_BUILD_DIR/ipa" -name "*.ipa" | head -1)
          [ -f "$IPA" ] || { echo "IPA not found"; exit 1; }
          printf '%s' "$CM_ASC_KEY_B64" | base64 -d > /tmp/asc_key.p8
          LOG=/tmp/asc_upload.log
          pip show codemagic-cli-tools 2>&1 | grep -E "^(Name|Version)" >> "$LOG" || true
          which app-store-connect >> "$LOG" 2>&1 || true
          echo "--- publish output ---" >> "$LOG"
          app-store-connect publish \
            --path "$IPA" \
            --key-id TH9U3Q6N34 \
            --issuer-id b7d9e967-a2df-47e8-82a2-29287c37db11 \
            --private-key @file:/tmp/asc_key.p8 >> "$LOG" 2>&1
          UPLOAD_EXIT=$?
          cat "$LOG"
          exit $UPLOAD_EXIT
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/xcarchive/*.xcarchive
      - /tmp/asc_upload.log

  # ── Android ───────────────────────────────────────────────────────────────
  ajose-android:
    name: Ajose Android
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android-signing
      node: 22.9.0
      java: 21
    scripts:
      - name: Install deps
        script: npm ci
      - name: Sync Capacitor
        script: |
          mkdir -p android/app/src/main/assets
          npx cap sync android
      - name: Decode keystore
        script: |
          echo "$CM_KEYSTORE_B64" | base64 --decode > /tmp/ajose-release.jks
      - name: Write key.properties
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/ajose-release.jks
          EOF
      - name: Build release AAB
        script: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
