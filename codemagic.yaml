workflows:

  # ── iOS ──────────────────────────────────────────────────────────────────
  ajose-ios:
    name: Ajose iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Ajose ASC Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ng.ajose.app
      vars:
        APP_STORE_APPLE_ID: 1234567890   # replace with actual Apple ID once created in App Store Connect
      node: 20.20.2
    scripts:
      - name: Install deps
        script: npm ci
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set bundle ID
        script: |
          cd ios/App
          xcrun agvtool new-marketing-version 1.0
      - name: Build & sign IPA
        script: |
          xcode-project use-profiles
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive | xcpretty
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -exportPath $CM_BUILD_DIR/ipa \
            -exportOptionsPlist /Users/builder/export_options.plist | xcpretty
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # ── Android ───────────────────────────────────────────────────────────────
  ajose-android:
    name: Ajose Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - ajose_keystore
      node: 20.20.2
      java: 17
    scripts:
      - name: Install deps
        script: npm ci
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build release AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
