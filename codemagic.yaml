workflows:

  # ── iOS ──────────────────────────────────────────────────────────────────
  ajose-ios:
    name: Ajose iOS
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Ajose ASC Key
    environment:
      vars:
        APP_STORE_APPLE_ID: 6815151482
        BUNDLE_ID: ng.ajose.app
      node: 22.9.0
    scripts:
      - name: Install deps
        script: npm ci
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set marketing version
        script: |
          cd ios/App
          xcrun agvtool new-marketing-version 1.0
      - name: Set up code signing
        script: |
          set -euo pipefail
          mkdir -p /tmp/signing

          # Decode P12 (cert + private key)
          printf '%s' "$CM_P12_BASE64" | base64 -d > /tmp/signing/signing.p12

          # Install pre-generated provisioning profile (no ASC API call needed)
          PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES_DIR"
          printf '%s' "$CM_AJOSE_PROFILE_B64" | base64 -d > "$PROFILES_DIR/ajose-appstore.mobileprovision"
          echo "=== Provisioning profile installed ==="

          keychain initialize
          keychain add-certificates \
            --certificate /tmp/signing/signing.p12 \
            --certificate-password codemagic
          xcode-project use-profiles
      - name: Build & sign IPA
        script: |
          set -eo pipefail
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive | xcpretty
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -exportPath $CM_BUILD_DIR/ipa \
            -exportOptionsPlist /Users/builder/export_options.plist | xcpretty
      - name: Upload to TestFlight
        script: |
          set -euo pipefail
          IPA=$(find "$CM_BUILD_DIR/ipa" -name "*.ipa" | head -1)
          [ -f "$IPA" ] || { echo "ERROR: IPA not found"; exit 1; }
          echo "IPA: $IPA"

          # Decode key to file
          printf '%s' "$CM_ASC_KEY_B64" | base64 -d > /tmp/asc_key.p8

          # Method 1: app-store-connect with env var auth (CLI auto-detects these 3 vars)
          export APP_STORE_CONNECT_KEY_IDENTIFIER=TH9U3Q6N34
          export APP_STORE_CONNECT_ISSUER_ID=b7d9e967-a2df-47e8-82a2-29287c37db11
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/asc_key.p8)"
          echo "--- codemagic-cli-tools version ---"
          pip show codemagic-cli-tools 2>/dev/null | head -3 || true
          echo "--- trying app-store-connect publish (env var auth) ---"
          if app-store-connect publish --path "$IPA" --testflight; then
            echo "SUCCESS: uploaded via app-store-connect"
            exit 0
          fi
          echo "app-store-connect failed, falling back to iTMSTransporter"

          # Method 2: iTMSTransporter (bundled with Xcode)
          ITMS=""
          for p in \
            "/usr/local/itms/bin/iTMSTransporter" \
            "$(xcode-select -p)/usr/bin/iTMSTransporter" \
            "/Applications/Xcode.app/Contents/SharedFrameworks/ContentDeliveryServices.framework/Versions/A/itms-services/iTMSTransporter/bin/iTMSTransporter"; do
            [ -x "$p" ] && ITMS="$p" && break
          done
          if [ -z "$ITMS" ]; then
            echo "iTMSTransporter not found; listing Xcode frameworks:"
            ls "$(xcode-select -p)/../SharedFrameworks/" 2>/dev/null | grep -i content || true
            exit 1
          fi
          echo "iTMSTransporter: $ITMS"
          mkdir -p ~/.appstoreconnect/private_keys
          cp /tmp/asc_key.p8 ~/.appstoreconnect/private_keys/AuthKey_TH9U3Q6N34.p8
          "$ITMS" -m upload -f "$IPA" -apiKey TH9U3Q6N34 -apiIssuer b7d9e967-a2df-47e8-82a2-29287c37db11
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # ── Android ───────────────────────────────────────────────────────────────
  ajose-android:
    name: Ajose Android
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android-signing
      node: 22.9.0
      java: 21
    scripts:
      - name: Install deps
        script: npm ci
      - name: Sync Capacitor
        script: |
          mkdir -p android/app/src/main/assets
          npx cap sync android
      - name: Decode keystore
        script: |
          echo "$CM_KEYSTORE_B64" | base64 --decode > /tmp/ajose-release.jks
      - name: Write key.properties
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/ajose-release.jks
          EOF
      - name: Build release AAB
        script: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
